<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ResQ Health | Find & Book Diagnostic Scans, Imaging & Medical Tests</title>

    <!-- Primary SEO Meta Tags -->
    <meta name="title" content="ResQ Health | Find & Book Diagnostic Scans, Imaging & Medical Tests" />
    <meta name="description" content="ResQ Health connects patients with top accredited diagnostic centers and healthcare providers across Nigeria. Compare prices, book MRI, CT scans, X-rays, Ultrasounds, and laboratory tests online." />
    <meta name="keywords" content="ResQ Health, diagnostic centers in Nigeria, medical imaging Lagos, MRI scan Lagos, CT scan price Nigeria, X-ray booking, ultrasound clinic, diagnostic test online booking, healthcare Nigeria, MedResQ" />
    <meta name="author" content="ResQ Health" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="theme-color" content="#16202E" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://resqhealth.africa/" />

    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://resqhealth.africa/" />
    <meta property="og:site_name" content="ResQ Health" />
    <meta property="og:title" content="ResQ Health | Find & Book Diagnostic Scans, Imaging & Medical Tests" />
    <meta property="og:description" content="Compare accredited diagnostic centers, find transparent pricing, and book your medical scans & tests seamlessly with ResQ Health." />
    <meta property="og:image" content="https://resqhealth.africa/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ResQ Health Diagnostic Booking Platform" />
    <meta property="og:locale" content="en_NG" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://resqhealth.africa/" />
    <meta name="twitter:title" content="ResQ Health | Find & Book Diagnostic Scans, Imaging & Medical Tests" />
    <meta name="twitter:description" content="Compare accredited diagnostic centers, find transparent pricing, and book your medical scans & tests seamlessly with ResQ Health." />
    <meta name="twitter:image" content="https://resqhealth.africa/og-image.jpg" />
    <meta name="twitter:site" content="@ResQHealth" />
    <meta name="twitter:creator" content="@ResQHealth" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "MedicalOrganization",
            "@id": "https://resqhealth.africa/#organization",
            "name": "ResQ Health",
            "url": "https://resqhealth.africa/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://resqhealth.africa/logo.png"
            },
            "description": "Digital healthcare platform connecting patients with accredited diagnostic centers, imaging laboratories, and healthcare providers across Nigeria.",
            "medicalSpecialty": [
              "https://schema.org/DiagnosticRadiology",
              "https://schema.org/LaboratoryMedicine"
            ],
            "areaServed": {
              "@type": "Country",
              "name": "Nigeria"
            },
            "contactPoint": {
              "@type": "ContactPoint",
              "contactType": "Customer Support",
              "url": "https://resqhealth.africa/support"
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://resqhealth.africa/#website",
            "url": "https://resqhealth.africa/",
            "name": "ResQ Health",
            "description": "Find and book medical scans, diagnostic imaging and laboratory tests across Nigeria.",
            "publisher": {
              "@id": "https://resqhealth.africa/#organization"
            },
            "potentialAction": {
              "@type": "SearchAction",
              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://resqhealth.africa/search?search={search_term_string}"
              },
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
